; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ******* Original MCU ********
; The ID 0x1ba01477 is the SWD debug-port ID of a genuine STM32F103
; and 0x2ba01477 is what the CKS CS32F103C8T6 clone reports 
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D CONFIG_ARDUINO_USB_CDC_ON_BOOT=1
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D HAL_PCD_MODULE_ENABLED
	-D USBD_USE_CDC
	-D configUSE_PREEMPTION=1
	-D configUSE_IDLE_HOOK=0
	-D configUSE_TICK_HOOK=0
	-D configCPU_CLOCK_HZ=72000000
	-D configTICK_RATE_HZ=1000
	-D configMAX_PRIORITIES=5
	-D configMINIMAL_STACK_SIZE=128
	-D configTOTAL_HEAP_SIZE=10240
lib_deps = 
	adafruit/Adafruit PWM Servo Driver Library@^2.4.0
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit TCA8418@^1.0.2
	arduino-libraries/LiquidCrystal@^1.0.7


; ******* Clone/Fake MCU ********
; and 0x2ba01477 is what the CKS CS32F103C8T6 clone reports
; Is it really fake?
; ID code: 			The ID is only a hint. The difference is in the debug
; 					port's revision field, not in the chip's own identity.
; 					ST-Link tools may still read both as an F10x.

; Marking: 			The text on the package proves nothing. Third parties
; 					can grind off the original marking and print a fake one.

; Behavior: 			Clones are not identical. One report found that 0x2BA01477
; 					chips don't raise a HardFault when code writes past the end
; 					of RAM, unlike genuine chips. Such differences matter if your
; 					code depends on fault handling.

; Register check: 	The DBGMCU_IDCODE register at 0xE0042000 read 0x20036410 on
; 					a CKS32, the same as a genuine F103C8 . So it can't tell them apart.

; Practical advice
; Don't rely on a clone for anything with tight timing, flash endurance or fault handling.
; Test it separately, and don't mix the two chips in one production batch. For a product,
; buy from a reputable distributor to get genuine parts.

[env:bluepill_clone]
platform = ststm32
board = bluepill_f103c8_128k
framework = arduino
upload_protocol = stlink
debug_tool = stlink
upload_flags = -c set CPUTAPID 0x2ba01477
debug_init_cmds = set CPUTAPID 0x2ba01477
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D CONFIG_ARDUINO_USB_CDC_ON_BOOT=1
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D HAL_PCD_MODULE_ENABLED
	-D USBD_USE_CDC
	-D configUSE_PREEMPTION=1
	-D configUSE_IDLE_HOOK=0
	-D configUSE_TICK_HOOK=0
	-D configCPU_CLOCK_HZ=72000000
	-D configTICK_RATE_HZ=1000
	-D configMAX_PRIORITIES=5
	-D configMINIMAL_STACK_SIZE=128
	-D configTOTAL_HEAP_SIZE=10240
lib_deps = 
	adafruit/Adafruit PWM Servo Driver Library@^2.4.0
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit TCA8418@^1.0.2
	arduino-libraries/LiquidCrystal@^1.0.7
